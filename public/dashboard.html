<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box & Beyond — Orders</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span><strong>Box & Beyond</strong><small>LOGISTICS OPS</small></span></div>
    </div>
    <nav class="sidebar-nav">
      <p class="nav-label">Main</p>
      <button class="nav-item active" data-view="orders">Orders</button>
      <button class="nav-item" data-view="needs-review">Needs review</button>
      <p class="nav-label">Debugging</p>
      <button class="nav-item" data-view="logs">Webhook logs</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="account-row">
        <span class="account-avatar" id="accountAvatar"></span>
        <span class="account-email" id="accountEmail"></span>
      </div>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <h1 id="viewTitle">Orders</h1>
      <div class="topbar-right">
        <button class="btn btn-outline btn-sm" id="logoutBtn">Log out</button>
      </div>
    </header>
    <main class="main">

      <section id="view-orders">
        <div class="stats-row" id="statsRow"></div>
        <div class="toolbar">
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="received">Received</option>
            <option value="shipment_created">Shipment created</option>
            <option value="dispatched">Dispatched</option>
            <option value="delivered">Delivered</option>
            <option value="failed">Failed</option>
            <option value="needs_review">Needs review</option>
          </select>
          <input type="text" id="search" placeholder="Search by student name or order id...">
          <button class="btn btn-outline btn-sm" id="refreshBtn">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Student</th>
              <th>Course</th>
              <th>Status</th>
              <th>AWB</th>
              <th>Received</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </section>

      <section id="view-logs" class="hide">
        <table>
          <thead>
            <tr>
              <th>Received</th>
              <th>Signature</th>
              <th>Order ID (from payload)</th>
              <th>Error</th>
            </tr>
          </thead>
          <tbody id="logsBody"></tbody>
        </table>
      </section>

    </main>
  </div>
</div>
<script src="api.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
